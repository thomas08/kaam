[build]
# TODO(M0): ยืนยันชื่อ target ของ C5 ตอนติดตั้ง ESP-IDF จริง
# C6 ใช้ riscv32imac-esp-espidf และ C5 ควรเหมือนกัน แต่ต้องตรวจก่อน
target = "riscv32imac-esp-espidf"

[target.riscv32imac-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32c5"
# C5 ต้องการ ESP-IDF v5.4 ขึ้นไป
ESP_IDF_VERSION = "v5.5"
